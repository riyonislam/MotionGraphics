name: Autonomous Tactical Battle Pipeline

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: "Google Drive Folder ID"
        required: true
        default: ""

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Multilingual Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            rclone \
            libpango1.0-dev \
            libcairo2-dev \
            pkg-config \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-beng \
            fonts-beng-extra
          fc-cache -fv

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          OLLAMA_API_KEYS: ${{ secrets.OLLAMA_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TARGET="${{ github.event.inputs.folder_id }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ secrets.DEFAULT_GDRIVE_FOLDER_ID }}"
          fi
          python pipeline.py --folder-id "$TARGET"

      - name: Upload Debug Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            workspace/*.json
            workspace/*.log
