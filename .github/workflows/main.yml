name: Autonomous Tactical Battle Pipeline

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: "গুগল ড্রাইভ ফোল্ডার আইডি (ফাঁকা রাখলে সিক্রেটস থেকে অটো নেবে)"
        required: false
        default: ""

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Multilingual Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            rclone \
            libpango1.0-dev \
            libcairo2-dev \
            pkg-config \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-beng \
            fonts-beng-extra
          fc-cache -fv

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pipeline
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          OLLAMA_API_KEYS: ${{ secrets.OLLAMA_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || secrets.DEFAULT_GDRIVE_FOLDER_ID }}
        run: |
          # যদি বক্সে কিছু না লেখেন, তবে সরাসরি GitHub Secrets থেকে আইডি নেবে
          INPUT_ID="${{ github.event.inputs.folder_id }}"
          TARGET_FOLDER="${INPUT_ID:-$SECRET_FOLDER_ID}"

          if [ -z "$TARGET_FOLDER" ]; then
            echo "ERROR: কোনো ফোল্ডার আইডি পাওয়া যায়নি! সিক্রেটসে GDRIVE_FOLDER_ID নিশ্চিত করুন।"
            exit 1
          fi

          python pipeline.py --folder-id "$TARGET_FOLDER"

      - name: Upload Debug Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            workspace/*.json
            workspace/*.log
